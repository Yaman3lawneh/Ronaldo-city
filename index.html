<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ronaldo City</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #17251b; touch-action: none; font-family: system-ui, sans-serif;
  }
  #game { display:block; width:100vw; height:100dvh; background:#35a853; }
  #hud {
    position:fixed; top: max(10px, env(safe-area-inset-top)); left:12px;
    color:white; background:#0008; padding:8px 12px; border-radius:12px;
    font-size:14px; pointer-events:none; direction:rtl;
  }
  #controls {
    position:fixed; inset:0; pointer-events:none;
  }
  .pad {
    position:absolute; bottom:max(22px, env(safe-area-inset-bottom));
    width:156px; height:156px; pointer-events:auto;
    display:grid; grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(3, 1fr); gap:5px;
    direction:ltr;
  }
  #dpad { left:max(18px, env(safe-area-inset-left)); }
  .key {
    border:1px solid #ffffff88; border-radius:15px;
    background:#102018a8; color:white; font-size:25px;
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .key.active { background:#e7a52dcc; transform:scale(.96); }
  .empty { visibility:hidden; }
  #hint {
    position:fixed; bottom:max(12px, env(safe-area-inset-bottom));
    right:max(18px, env(safe-area-inset-right)); color:white;
    background:#0008; padding:9px 12px; border-radius:12px;
    font-size:12px; max-width:42vw; text-align:center; pointer-events:none;
  }
  #rotate {
    display:none; position:fixed; inset:0; background:#142019; color:white;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    z-index:5; font-size:20px;
  }
  @media (orientation: portrait) {
    #rotate { display:flex; }
  }
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17251b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ronaldo City">
<link rel="apple-touch-icon" href="icon-192.png">
\n</head>
<body>
<canvas id="game"></canvas>
<div id="hud">رونالدو سيتي · <span id="position">0, 0</span></div>
<div id="controls">
  <div id="dpad" class="pad">
    <div class="key empty"></div><div class="key" data-dir="up">▲</div><div class="key empty"></div>
    <div class="key" data-dir="left">◀</div><div class="key empty"></div><div class="key" data-dir="right">▶</div>
    <div class="key empty"></div><div class="key" data-dir="down">▼</div><div class="key empty"></div>
  </div>
</div>
<div id="hint">استخدم الأسهم لتحريك اللاعب</div>
<div id="rotate">↻<br><br>أدر iPhone إلى الوضع الأفقي للعب</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const posLabel = document.getElementById('position');

  const WORLD_W = 2000, WORLD_H = 2000;
  let W = 800, H = 600, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const player = { x: WORLD_W/2, y: WORLD_H/2, w: 42, h: 58, speed: 260 };
  let cameraX = 0, cameraY = 0;
  const held = {up:false, down:false, left:false, right:false};

  // مدينة عشوائية، مع ترك مساحة حول نقطة البداية
  let seed = 24681357;
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  const buildings = [];
  const buildingColors = ['#65758b','#8b6958','#777d86','#a08b65','#596d79'];
  for (let i=0; i<32; i++) {
    let w = 75 + rand()*115, h = 70 + rand()*125;
    let x = 30 + rand()*(WORLD_W-w-60), y = 30 + rand()*(WORLD_H-h-60);
    if (Math.abs(x-WORLD_W/2)<170 && Math.abs(y-WORLD_H/2)<170) { i--; continue; }
    buildings.push({x,y,w,h,c:buildingColors[Math.floor(rand()*buildingColors.length)]});
  }

  function roundedRect(x,y,w,h,r,fill) {
    ctx.fillStyle=fill; ctx.beginPath();
    ctx.roundRect(x,y,w,h,r); ctx.fill();
  }

  function drawWorld() {
    ctx.fillStyle = '#42a85a'; ctx.fillRect(0,0,W,H);

    // خطوط عشب خفيفة
    ctx.strokeStyle = '#ffffff0b'; ctx.lineWidth=1;
    for(let x=-(cameraX%100); x<W; x+=100) {
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
    }
    for(let y=-(cameraY%100); y<H; y+=100) {
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }

    // طرق بسيطة
    ctx.fillStyle='#b7b29a';
    for(let x=0; x<WORLD_W; x+=500) {
      ctx.fillRect(x-cameraX, 0-cameraY, 46, WORLD_H);
    }
    for(let y=0; y<WORLD_H; y+=500) {
      ctx.fillRect(0-cameraX, y-cameraY, WORLD_W, 46);
    }

    for(const b of buildings) {
      const x=b.x-cameraX, y=b.y-cameraY;
      if(x+b.w < -20 || y+b.h < -20 || x > W+20 || y > H+20) continue;
      ctx.fillStyle='#00000030'; ctx.fillRect(x+7,y+8,b.w,b.h);
      roundedRect(x,y,b.w,b.h,7,b.c);
      ctx.strokeStyle='#27333c'; ctx.lineWidth=3; ctx.strokeRect(x,y,b.w,b.h);
      ctx.fillStyle='#d9d3b7';
      for(let wx=12; wx<b.w-12; wx+=30) {
        for(let wy=12; wy<b.h-12; wy+=30) {
          ctx.fillRect(x+wx,y+wy,12,12);
        }
      }
      ctx.fillStyle='#44372e'; ctx.fillRect(x+b.w/2-9,y+b.h-24,18,24);
    }
  }

  function drawPlayer() {
    const x=player.x-cameraX, y=player.y-cameraY;
    // ظل
    ctx.fillStyle='#0004'; ctx.beginPath();
    ctx.ellipse(x+player.w/2,y+player.h-3,20,7,0,0,Math.PI*2); ctx.fill();
    // جسم لاعب بديل مرسوم حتى دون صورة
    roundedRect(x+8,y+18,26,29,8,'#f4f4f4');
    roundedRect(x+5,y+18,9,27,5,'#d7a46e');
    roundedRect(x+28,y+18,9,27,5,'#d7a46e');
    // قميص أحمر
    roundedRect(x+9,y+19,24,24,5,'#c92532');
    // شورت
    ctx.fillStyle='#eeeeee'; ctx.fillRect(x+10,y+42,22,10);
    // الساقان
    ctx.fillStyle='#d7a46e'; ctx.fillRect(x+12,y+50,7,6); ctx.fillRect(x+23,y+50,7,6);
    // الرأس والشعر
    ctx.fillStyle='#d9a477'; ctx.beginPath(); ctx.arc(x+21,y+11,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#38251d'; ctx.beginPath(); ctx.arc(x+21,y+7,11,Math.PI,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 9px system-ui'; ctx.textAlign='center';
    ctx.fillText('7',x+21,y+35);
  }

  function update(dt) {
    let dx=(held.right?1:0)-(held.left?1:0);
    let dy=(held.down?1:0)-(held.up?1:0);
    if(dx && dy) { dx*=Math.SQRT1_2; dy*=Math.SQRT1_2; }
    player.x += dx*player.speed*dt;
    player.y += dy*player.speed*dt;
    player.x=Math.max(0,Math.min(WORLD_W-player.w,player.x));
    player.y=Math.max(0,Math.min(WORLD_H-player.h,player.y));

    cameraX=player.x+player.w/2-W/2;
    cameraY=player.y+player.h/2-H/2;
    cameraX=Math.max(0,Math.min(WORLD_W-W,cameraX));
    cameraY=Math.max(0,Math.min(WORLD_H-H,cameraY));
    posLabel.textContent = `${Math.round(player.x)}, ${Math.round(player.y)}`;
  }

  // أزرار لمس تعمل بالضغط المستمر
  document.querySelectorAll('[data-dir]').forEach(btn => {
    const dir=btn.dataset.dir;
    const on=e=>{ e.preventDefault(); held[dir]=true; btn.classList.add('active'); };
    const off=e=>{ e.preventDefault(); held[dir]=false; btn.classList.remove('active'); };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off);
    btn.addEventListener('pointerleave', off);
    btn.addEventListener('contextmenu', e=>e.preventDefault());
  });

  // دعم لوحة المفاتيح عند التجربة على الكمبيوتر
  const keyMap={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',
                ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
  window.addEventListener('keydown',e=>{ if(keyMap[e.key]) {held[keyMap[e.key]]=true; e.preventDefault();} });
  window.addEventListener('keyup',e=>{ if(keyMap[e.key]) {held[keyMap[e.key]]=false; e.preventDefault();} });
  window.addEventListener('blur',()=>Object.keys(held).forEach(k=>held[k]=false));

  let last=performance.now();
  function loop(now) {
    const dt=Math.min((now-last)/1000,0.04); last=now;
    update(dt);
    drawWorld();
    drawPlayer();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
